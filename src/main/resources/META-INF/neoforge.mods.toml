modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

# Server-side only mod: clients without it may still connect to a server that has it installed.
displayTest = "IGNORE_ALL_VERSION"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"

description = '''
${mod_description}
'''

[[dependencies.sableautoload]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.sableautoload]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.sableautoload]]
modId = "sable"
type = "required"
versionRange = "[2.0,)"
ordering = "NONE"
side = "BOTH"
